# A version tag (v1.0.0) builds the installers and publishes them as a GitHub
# release: the download links on the site read the latest one.
name: release

on:
  push:
    tags: ["v*"]
  # Manual run: one platform or both; with `tag`, the installers go into
  # that existing release, otherwise nothing is published.
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: [all, macos-latest, ubuntu-22.04]
        default: all
      tag:
        description: Existing release to upload to (empty = build only)
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64
        os: ${{ fromJSON((inputs.os == '' || inputs.os == 'all') && '["macos-latest","ubuntu-22.04"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    env:
      # Only whether the macOS signing secrets exist, not their value.
      SIGN_MAC: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      # Same for the key that signs the update packages.
      SIGN_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      # The app updates itself from latest.json, which needs packages signed with our
      # key. Without it (a fork, or before the secret is uploaded) the build skips the
      # update packages and latest.json: the bundler fails on a public key with no
      # private one, so the setting is only passed when the key is there.
      - if: env.SIGN_UPDATER == 'true'
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<UPDATER_KEY_EOF"
            echo "$UPDATER_KEY"
            echo "UPDATER_KEY_EOF"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PASSWORD"
            echo "TAURI_ARGS=--config src-tauri/updater.conf.json"
          } >> "$GITHUB_ENV"

      # Signed with the team's certificate, so macOS keeps the permissions
      # granted to Work from one release to the next.
      - if: runner.os == 'macOS' && env.SIGN_MAC == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: ${{ env.TAURI_ARGS }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: Work ${{ github.ref_name }}
          releaseBody: Installer per macOS (Apple Silicon) e Linux (x86_64). Vedi https://overzoomit.github.io/work-stack/
          releaseDraft: false
          prerelease: false

      # Linux, and macOS without the secrets (a fork, or before they are
      # uploaded): the bundler reads an empty APPLE_CERTIFICATE as a
      # certificate to import and fails, so the variables are left out.
      - if: runner.os != 'macOS' || env.SIGN_MAC != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: ${{ env.TAURI_ARGS }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: Work ${{ github.ref_name }}
          releaseBody: Installer per macOS (Apple Silicon) e Linux (x86_64). Vedi https://overzoomit.github.io/work-stack/
          releaseDraft: false
          prerelease: false

      - if: github.ref_type != 'tag' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
