id = "claude"
aliases = ["claude", "claude-code", "claude code"]
version = 1

[[rules]]
id = "claude-permission"
state = "blocked"
priority = 100
region = "prompt_block"
prompt_type = "permission"
predicates.contains = [
  "do you want to proceed",
  "allow this",
  "allow the",
  "approve this",
  "approve the",
  "permission request",
  "permission required",
  "permission to",
  "trust the files",
  "do you want to make this edit",
]

[[rules]]
id = "claude-confirmation"
state = "blocked"
priority = 100
region = "prompt_block"
prompt_type = "confirmation"
predicates.contains = ["enter to confirm", "press enter to continue", "continue?"]
predicates.regex = ['\[y/n\]', '\(y/n\)', '\byes\s*/\s*no\b']

[[rules]]
id = "claude-selection"
state = "blocked"
priority = 100
region = "prompt_block"
prompt_type = "selection"
predicates.line_regex = ['^\s*[❯>]\s*\d+[.)]\s+\S']

[[rules]]
id = "claude-question"
state = "blocked"
priority = 90
region = "last_non_empty_line"
prompt_type = "question"
predicates.line_regex = ['\?\s*$']

[[rules]]
id = "claude-spinner"
state = "working"
priority = 50
# The progress line sits above the input box and a multi-line statusline.
region = "bottom_non_empty_lines(12)"
predicates.regex = ['[\u{2800}-\u{28FF}]']

[[rules]]
id = "claude-interrupt-hint"
state = "working"
priority = 50
region = "bottom_non_empty_lines(3)"
predicates.contains = ["esc to interrupt", "esc to stop", "esc to cancel"]

[[rules]]
id = "claude-thinking"
state = "working"
priority = 40
region = "bottom_non_empty_lines(12)"
# "✢ Cooking… (2m · thinking)": the active progress line; "✻ Cooked for 2m" is done.
predicates.line_regex = ['^\s*[✢✻✶✳✽·]\s+\S+…\s*\(', '^\s*\b(thinking|working|analyzing|running|executing)\b\s*(…|\.\.\.)\s*$']
