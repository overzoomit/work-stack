[package]
name = "work"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "process", "time", "io-util", "macros"] }
notify = "8"
portable-pty = "0.9.0"
libc = "0.2.189"
trash = "5.2.9"
tauri-plugin-opener = "2"
sysinfo = "0.39.6"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# Paths of files dragged in from Finder (the page only sees their names).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
